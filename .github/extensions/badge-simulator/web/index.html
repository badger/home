<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badge Simulator</title>
    <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/simulator.css">
</head>
<body>
  <main id="sim" tabindex="-1">
    <header class="toolbar">
      <label class="app-picker" title="App from badge/apps to run">
        <span class="sr-only">App</span>
        <select data-app aria-label="App to run"><option value="">Loading…</option></select>
      </label>
      <button type="button" class="btn icon" data-reload title="Reload the app from disk" aria-label="Reload app">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
      <span class="status" data-status role="status" aria-live="polite">Booting simulator…</span>
      <button type="button" class="btn primary" data-deploy disabled title="Ask Copilot to deploy this app to the connected badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
        Deploy
      </button>
    </header>

    <section class="stage">
      <div class="view-tools" role="group" aria-label="Badge view">
        <button type="button" class="btn tool" data-model-screen aria-pressed="false" title="Zoom to the screen" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/></svg>Screen
        </button>
        <button type="button" class="btn tool" data-model-full aria-pressed="true" title="Show the whole badge" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>Full
        </button>
        <button type="button" class="btn tool" data-model-rotate aria-pressed="false" title="Turn the badge upside down">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>Rotate
        </button>
      </div>
      <div class="model" data-model>
        <canvas data-screen width="320" height="240" aria-label="Badge display"></canvas>
        <p class="model-status" data-model-status hidden></p>
      </div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" class="btn icon" data-model-zoom-in aria-label="Zoom in" title="Zoom in" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
        <button type="button" class="btn icon" data-model-zoom-out aria-label="Zoom out" title="Zoom out" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      </div>
    </section>

    <nav class="keys" role="group" aria-label="Badge controls">
      <div class="key-group">
        <button type="button" class="key" data-button="16" aria-label="Left" title="Left (←)"><svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
        <button type="button" class="key" data-button="2" aria-label="Up" title="Up (↑)"><svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
        <button type="button" class="key" data-button="1" aria-label="Down" title="Down (↓)"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></button>
        <button type="button" class="key" data-button="8" aria-label="Right" title="Right (→)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
      </div>
      <div class="key-group">
        <button type="button" class="key" data-button="4" aria-label="Select" title="Select (Space / Enter)"><svg viewBox="0 0 24 24"><path d="M9 10 4 15l5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg></button>
        <button type="button" class="key" data-button="8192" aria-label="Back" title="Back (K)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button type="button" class="key" data-button="16384" aria-label="Menu" title="Menu (U)"><svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
        <button type="button" class="key" data-button="32" aria-label="Home" title="Home (Esc) — restarts the app"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      </div>
    </nav>

    <details class="output">
      <summary>Output <button type="button" class="link" data-clear-output>Clear</button></summary>
      <pre data-output tabindex="0" aria-label="Simulator output"></pre>
    </details>
  </main>
  <script type="module" src="/simulator.js"></script>
</body>
</html>
