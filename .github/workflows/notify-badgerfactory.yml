name: Notify badgerfactory

on:
  push:
    branches: [main]
    paths:
      - "badge/apps/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger badgerfactory repository dispatch
        env:
          DISPATCH_TOKEN: ${{ secrets.BADGERFACTORY_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/badger/badgerfactory/dispatches \
            -d "{\"event_type\":\"apps-updated\",\"client_payload\":{\"repository\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${SHA}\"}}"
